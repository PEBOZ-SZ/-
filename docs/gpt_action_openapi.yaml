openapi: 3.1.0
info:
  title: Auto Quote Agent Action
  version: 0.3.0
  description: >
    Safe Custom GPT Action gateway for quote drafts. The Action can create or
    update a draft, request recalculation through the existing quote engine,
    and submit a confirmed draft for pending review. It does not expose
    internal management, export, or final review endpoints.
servers:
  - url: https://weilai-pxj.com
paths:
  /api/quote/import:
    post:
      operationId: importQuoteSheet
      summary: Import parsed quote-sheet rows into the existing quotation form
      description: >
        Use this after the GPT has parsed an Excel/BOM into customer quotation
        form rows. The backend stores the rows as an existing quote record and
        returns a quote-sheet preview URL. The GPT must not invent final prices
        after import; the salesperson opens the existing quotation form, reviews
        it, and uses the page's normal PDF export.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteImportRequest"
            examples:
              quoteSheetRows:
                summary: Import one product row
                value:
                  quote_no: "B260160"
                  salesperson: "08"
                  customer_name: "1688-Yvy"
                  customer_country: "中国"
                  currency_unit: "RMB/个"
                  products:
                    - name: "PU女包"
                      image_data_url: "data:image/jpeg;base64,..."
                      size: "35.56×19.05×22.85cm"
                      desc: "主料：PU荔纹外料，米色"
                      pack: "1个/胶袋"
                      qty: 1000
                      price: 68.1
                      total: 68100
                      note: "暂估报价，需业务员确认"
                  source_file_name: "01-B260160.xlsx"
      responses:
        "200":
          description: Quote imported into the existing quote-sheet flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteImportResponse"
              examples:
                imported:
                  value:
                    success: true
                    quote_id: "gpt-import-B260160-a1b2c3d4e5"
                    quote_no: "B260160"
                    quote_uid: "B260160"
                    version_no: 1
                    preview_url: "/?view=quoteSheet&quote_uid=B260160"
        "400":
          description: Invalid import payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteImportError"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAgentResponse"
  /gpt/quote-agent:
    post:
      operationId: quoteAgent
      summary: Update, recalculate, clarify, or submit an auto quote draft
      description: >
        Send the user's Chinese instruction to the quote draft agent. Pricing is
        produced only by the existing backend quote calculation tool. Formal
        saving is blocked while missing_fields or risk_flags remain.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteAgentRequest"
            examples:
              updateQuantityAndPrice:
                summary: Update quantity and PU material price
                value:
                  session_id: gpt-session-001
                  message: "数量改300，PU料按6.5"
                  payload:
                    product_name: "测试包"
                    quantities:
                      - 500
                    items:
                      - name: "PU料"
                        usage: "0.5平方"
                        unit_price: "6元"
              confirmSave:
                summary: Confirm save and submit for pending review
                value:
                  session_id: gpt-session-001
                  message: "确认保存"
      responses:
        "200":
          description: Quote agent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAgentResponse"
              examples:
                quoteUpdated:
                  summary: Draft updated and recalculated
                  value:
                    ok: true
                    type: quote_updated
                    assistant_message: "报价草稿已更新，并由系统重新计算。"
                    draft:
                      session_id: gpt-session-001
                      quantities:
                        - 300
                    quote_result:
                      quote_id: quote_calc_001
                      approval_status: draft
                    missing_fields: []
                    risk_flags: []
                clarify:
                  summary: More information is required
                  value:
                    ok: true
                    type: clarify
                    assistant_message: "现在还不能保存正式报价，还需确认：箱子是否参与报价。"
                    draft:
                      session_id: gpt-session-001
                    quote_result:
                      quote_id: quote_calc_001
                    missing_fields: []
                    risk_flags:
                      - "箱子是否参与报价"
                saved:
                  summary: Draft saved and submitted with pending status
                  value:
                    ok: true
                    type: saved
                    assistant_message: "已保存并提交，当前状态：待管理员处理。"
                    draft:
                      session_id: gpt-session-001
                    quote_result:
                      quote_id: quote_calc_001
                      approval_status: pending
                    missing_fields: []
                    risk_flags: []
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAgentResponse"
              examples:
                invalidMessage:
                  summary: Missing message
                  value:
                    ok: false
                    type: error
                    assistant_message: "缺少 message。"
                    draft: null
                    quote_result: null
                    missing_fields: []
                    risk_flags: []
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAgentResponse"
              examples:
                unauthorized:
                  summary: Token is missing or invalid
                  value:
                    ok: false
                    type: error
                    assistant_message: "未授权的 GPT Action 调用。"
                    draft: null
                    quote_result: null
                    missing_fields: []
                    risk_flags: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: GPT_ACTION_TOKEN
  schemas:
    QuoteAgentRequest:
      type: object
      additionalProperties: false
      required:
        - session_id
        - message
      properties:
        session_id:
          type: string
          minLength: 1
          description: Stable conversation or quote draft session id from the Custom GPT.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Original Chinese user instruction, such as "数量改300，PU料按6.5" or "确认保存".
        spreadsheet_rows:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SpreadsheetRow"
          description: >
            Rows parsed by the GPT from an uploaded Excel/CSV/table. Use this
            when the user uploads a spreadsheet in ChatGPT. Each row should use
            common keys such as 材料/名称/name, 规格/spec, 用量/数量/usage, 单价/unit_price,
            金额/amount. Do not send binary file bytes here.
        sheets:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SpreadsheetSheet"
          description: Optional workbook sheets parsed by the GPT. Use when the file has multiple sheets.
        product_name:
          type: string
          nullable: true
          description: Optional product name inferred from the spreadsheet.
        quantities:
          type: array
          nullable: true
          items:
            oneOf:
              - type: integer
              - type: number
              - type: string
          description: Optional quote quantities inferred from the spreadsheet or user request.
        processing_fee:
          oneOf:
            - type: number
            - type: string
          nullable: true
          description: Optional processing fee from the spreadsheet or user request.
        gross_margin_rate:
          oneOf:
            - type: number
            - type: string
          nullable: true
          description: Optional gross margin rate, such as 0.35 or "35%".
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Structured quote input from the auto quote system, used to seed a draft when present.
        quote_result:
          type: object
          nullable: true
          additionalProperties: true
          description: Existing calculation result from the auto quote system, used to seed or refresh a draft when present.
        user_context:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional sales user context. The gateway defaults to a sales quote-agent identity.
    SpreadsheetRow:
      type: object
      additionalProperties: true
      description: A material or quote row parsed from a spreadsheet.
      properties:
        name:
          type: string
          description: Material name. Chinese aliases like 材料、物料、名称 are also accepted.
        material:
          type: string
          description: Material name alias.
        spec:
          type: string
          description: Specification. Chinese aliases like 规格、型号、材质 are also accepted.
        usage:
          type: string
          description: Material usage. Chinese aliases like 用量、数量、单耗 are also accepted.
        unit_price:
          type: string
          description: Material unit price. Chinese aliases like 单价、价格、单价参考 are also accepted.
        amount:
          oneOf:
            - type: number
            - type: string
          description: Optional row subtotal/cost. If omitted, the backend recalculates usage × unit_price when possible.
    SpreadsheetSheet:
      type: object
      additionalProperties: true
      properties:
        sheet_name:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpreadsheetRow"
    QuoteImportRequest:
      type: object
      additionalProperties: true
      required:
        - quote_no
        - products
      properties:
        quote_no:
          type: string
          minLength: 1
          description: Customer-facing quotation number, for example B260160.
        salesperson:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        customer_country:
          type: string
          nullable: true
        currency_unit:
          type: string
          nullable: true
        source_file_name:
          type: string
          nullable: true
        products:
          type: array
          minItems: 1
          description: Rows for the existing quote sheet product table.
          items:
            $ref: "#/components/schemas/QuoteSheetProductRow"
        materials:
          type: array
          nullable: true
          description: Optional material details kept for internal review.
          items:
            type: object
            additionalProperties: true
        summaries:
          type: array
          nullable: true
          description: Optional quote summaries kept with the quote record.
          items:
            type: object
            additionalProperties: true
    QuoteSheetProductRow:
      type: object
      additionalProperties: true
      properties:
        image_data_url:
          type: string
          nullable: true
          description: >
            Main product photo as a data URL or public image URL. Use the bag/product
            image from the uploaded spreadsheet when available. Do not use BOM table,
            material detail, logo-only, barcode, QR code, or packaging instruction images.
        name:
          type: string
          description: Product name shown in the quotation form.
        size:
          type: string
          description: Product size shown in the quotation form.
        desc:
          type: string
          description: Brief customer-facing product/material description.
        pack:
          type: string
          description: Packaging text.
        qty:
          oneOf:
            - type: number
            - type: string
          description: Quote quantity.
        price:
          oneOf:
            - type: number
            - type: string
          description: Unit price shown in the quote sheet.
        total:
          oneOf:
            - type: number
            - type: string
          nullable: true
          description: Row total. If omitted, the backend fills qty × price when possible.
        note:
          type: string
          nullable: true
    QuoteImportResponse:
      type: object
      additionalProperties: true
      required:
        - success
        - quote_id
        - quote_no
        - quote_uid
      properties:
        success:
          type: boolean
        quote_id:
          type: string
        quote_no:
          type: string
        quote_uid:
          type: string
        version_id:
          type: string
          nullable: true
        version_no:
          type: integer
          nullable: true
        preview_url:
          type: string
    QuoteImportError:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
    QuoteAgentResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - type
        - assistant_message
        - draft
        - quote_result
        - missing_fields
        - risk_flags
      properties:
        ok:
          type: boolean
        type:
          type: string
          enum:
            - quote_updated
            - clarify
            - price_lookup
            - saved
            - error
        assistant_message:
          type: string
          description: Chinese message suitable for the GPT to summarize to the user.
        draft:
          type:
            - object
            - "null"
          additionalProperties: true
        quote_result:
          type:
            - object
            - "null"
          additionalProperties: true
        missing_fields:
          type: array
          items:
            type: string
        risk_flags:
          type: array
          items:
            type: string
        save_result:
          type:
            - object
            - "null"
          additionalProperties: true

